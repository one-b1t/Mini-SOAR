input {
  pipeline { address => "alert-pipeline" }
}

filter {
  # tambahkan timestamp string untuk konsumer
  ruby {
    code => '
      begin
        ts = event.get("@timestamp")
        event.set("ts", ts.time.iso8601) if ts.respond_to?(:time)
      rescue
      end
    '
  }

  # Prioritas alert_type (webshell_immediate paling tinggi)
  ruby {
    code => '
      tags = (event.get("tags") || []).map(&:to_s)
      prio = [
        "alert_webshell_immediate",
        "alert_webshell_name",
        "alert_gambling_slot",
        "alert_url_major",
        "alert_webshell_heur",
        "alert_url_probe",
        "alert_url_minor",
        "alert_random_url",
        "alert_distributed_error"
      ]
      sel = prio.find { |t| tags.include?(t) } || "alert_generic"
      event.set("[alert][type]", sel)

      sev = event.get("[minisoar][severity]") || (
        case sel
        when "alert_webshell_name","alert_gambling_slot","alert_url_major","alert_webshell_immediate" then "high"
        when "alert_webshell_heur","alert_url_probe","alert_url_minor"                              then "medium"
        else "low"
        end
      )
      event.set("[alert][severity]", sev)
    '
  }

  # Normalisasi payload alert
  mutate {
    rename => { "src_ip"       => "[alert][src_ip]" }
    rename => { "server_name"  => "[alert][server_name]" }
    rename => { "url_original" => "[alert][url]" }
    rename => { "http_status"  => "[alert][status]" }
    rename => { "[http][request][method]"       => "[alert][method]" }
    rename => { "http_method"                   => "[alert][method]" }
    rename => { "method"                        => "[alert][method]" }
    rename => { "[http][response][status_code]" => "[alert][status]" }
    copy   => {
      "tags"                   => "[alert][tags]"
      "ts"                     => "[alert][ts]"
      "count"                  => "[alert][count]"
      "ip_list"                => "[alert][ip_list]"
      "url_list"               => "[alert][url_list]"
      "top_urls"               => "[alert][top_urls]"
      "samples"                => "[alert][samples]"     # <<— penting utk Top-5 webshell burst
      "[minisoar][severity]"   => "[alert][severity_hint]"
      "[minisoar][webshell_indicators]" => "[alert][indicators]"
    }
  }

  # Judul default
  ruby {
    code => '
      t = (event.get("[alert][type]") || "").to_s
      plain = "Security Alert"; emo = "🔔"
      case t
      when "alert_webshell_name"     then plain,emo = "WebShell Name Match","🪟"
      when "alert_webshell_heur"     then plain,emo = "WebShell Heuristic","🕸️"
      when "alert_gambling_slot"     then plain,emo = "Gambling/Slot Pattern","🎰"
      when "alert_url_major"         then plain,emo = "URL Error Burst (Major)","🚨"
      when "alert_url_minor"         then plain,emo = "URL Burst (Minor)","⚠️"
      when "alert_url_probe"         then plain,emo = "Exploit/Probe URL","🛠️"
      when "alert_random_url"        then plain,emo = "Random URL Spray","🎲"
      when "alert_distributed_error" then plain,emo = "[DISTRIBUTED ERROR]","🌐"
      when "alert_webshell_immediate"then plain,emo = "WebShell Immediate","🧨"
      end
      event.set("[alert][title_plain]", plain)
      event.set("[alert][emoji]", emo)
      event.set("[alert][title]", "#{plain} #{emo}")
    '
  }

  # Overwrite judul khusus untuk WebShell Burst minor
  ruby {
    code => '
      t = (event.get("[alert][type]") || "").to_s
      tags = (event.get("tags") || []).map(&:to_s)
      if t == "alert_url_minor" && tags.include?("webshell_burst")
        event.set("[alert][title_plain]", "WebShell Burst (Minor)")
        event.set("[alert][title]", "WebShell Burst (Minor) 🪪")
      end
    '
  }

  # SUPPRESS: single-hit webshell GET non-200 (ditahan di detection, jaga-jaga di sini juga)
  if "silence_webshell_single" in [tags] {
    mutate { remove_field => ["[alert][type]", "[alert][title]", "[alert][title_plain]"] }
  }
}

output {
  # Hanya kirim jika sudah punya [alert][type]
  if [alert][type] {
    redis {
      host => "127.0.0.1"
      port => 6379
      data_type => "list"
      key => "logstash_alert_queue"
      codec => json_lines
    }
    stdout { codec => rubydebug }
  }
}
