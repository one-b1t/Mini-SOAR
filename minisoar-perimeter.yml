# miniSOAR Security Perimeter Mapping
# Maps websites to their respective security perimeters (paloalto / akamai / imperva / none)

sites:
  test-site.com:
    provider: imperva
  another-site.com:
    provider: akamai
  internal-portal.local:
    provider: paloalto
  mock-target.com:
    provider:
      - paloalto
      - akamai
  "*.mock-target.com":
    provider:
      - akamai
      - imperva
