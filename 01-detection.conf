# 01-detection.conf — versi terintegrasi (bebas konflik aggregate)
# Immediate WebShell (200/POST) => alert_webshell_immediate
# Burst WebShell (GET & non-200) 60s => 1 alert/IP bila count >= WEBSHELL_BURST_THRESHOLD (default 30)
# Burst WebShell menyertakan Top-5 sample: method;url;status
# Penting: pipeline.workers: 1 untuk stage yg pakai aggregate

input {
  elasticsearch {
    hosts => ["https://172.30.103.21:9200"]
    index => "filebeat-*"
    user => "elastic"
    password => "${ES_PASS}"
    ssl_enabled => true
    ssl_verification_mode => "none"
    schedule => "*/30 * * * * *"
    docinfo => true
    docinfo_fields => ["_index", "_id"]
    query => '
    {
      "query": {
        "range": {
          "@timestamp": { "gte": "now-1m" }
        }
      }
    }'
  }
}

filter {
  ########################################################################
  # [A] Normalisasi field
  ########################################################################
  ruby {
    code => "
      event.set('src_ip',
        event.get('[source][ip]') || event.get('[client][ip]') ||
        event.get('src_ip')       || event.get('[http][client_ip]') ||
        event.get('[network][client][ip]')
      )
      event.set('url_original',
        event.get('[url][original]') || event.get('[url]') || event.get('url_original')
      )
      event.set('http_status',
        event.get('[http][response][status_code]') || event.get('[http][status_code]') || event.get('http_status')
      )
      event.set('server_name',
        event.get('[haproxy][server_name]') || event.get('[server][name]') || event.get('server_name')
      )
    "
  }
  if ![src_ip] or ![url_original] or ![http_status] { mutate { add_tag => ["_missing_field"] } }

  ########################################################################
  # [B] Web-shell: signature & heuristic
  ########################################################################
  if [url_original] {
    ruby {
      init => '
        exts = %w[php phtml phar pht php3 php4 php5 php7 asp aspx asa cer ashx jsp jsxp jspx cfm cfml shtml]
        @rx_ext_exec = /\.(?:#{exts.join("|")})(?:\z|\?)/i
        @rx_shell_names = %r{
          (?:^|/)(
             c99|c100|r57|wso|b374k|filesman|p0wny(?:-shell)?|weevely|indoxploit|
             (?:china[-_ ]?chopper)|godzilla|behinder|aspxspy|xleet|marvinshell|gaza|
             alfa(?:bypass)?|r00tshell|php-reverse-shell|laudanum|
             cmd(?:shell)?|cmd\.(?:php|aspx|asp|jsp)
          )[-_\.]?(?:\d+|new)?\.(?:#{exts.join("|")})(?:\z|\?)
        }ix
        @rx_double_ext     = /\.(?:jpe?g|png|gif|bmp|svg|webp)\.(?:php|phtml|phar|pht)(?:\z|\?)/i
        @rx_exec_in_upload = %r{/(?:wp-content/uploads|uploads?|storage|images|img|files|cache|tmp)/[^?]+\.(?:#{exts.join("|")})(?:\z|\?)}i
        @rx_preview_php    = /preview\.php(?:\z|\?)/i
        @rx_adminer_abuse  = /(?:^|\/)adminer\.php(?:\z|\?)/i
        @rx_shell_params   = /(?:\b(?:cmd|exec|system|passthru|popen|proc_open|assert|eval|payload|code|0)=)/i
        @rx_b64_long       = /=([A-Za-z0-9+\/]{120,}={0,2})(?:&|\z)/
      '
      code => '
        url  = event.get("url_original").to_s
        tags = (event.get("tags") || [])
        inds = []

        if url =~ @rx_shell_names
          tags |= ["alert_webshell_name","sig_webshell_name"]
          event.set("[minisoar][severity]", "high")
          inds << "name"
        end

        param_hit        = (url =~ @rx_shell_params)
        exec_ext_hit     = (url =~ @rx_ext_exec)
        upload_exec_hit  = (url =~ @rx_exec_in_upload)
        inds << "double_ext" if url =~ @rx_double_ext
        inds << "upload"     if upload_exec_hit
        inds << "preview"    if url =~ @rx_preview_php
        inds << "adminer"    if url =~ @rx_adminer_abuse
        inds << "params"     if param_hit
        inds << "b64"        if (url =~ @rx_b64_long) && (param_hit || exec_ext_hit || upload_exec_hit)

        unless (inds & ["double_ext","upload","preview","adminer","params","b64"]).empty?
          tags |= ["alert_webshell_heur"]
          event.set("[minisoar][severity]", "medium") unless event.get("[minisoar][severity]")
        end

        tags |= ["exec_ext"] if exec_ext_hit

        event.set("tags", tags) unless tags.empty?
        event.set("[minisoar][webshell_indicators]", inds) unless inds.empty?
      '
    }
  }

  ########################################################################
  # [C] Gambling / Slot (signature + YAML whitelist + burst 60s)
  ########################################################################
  if [url_original] {
    ruby {
      init => '
        require "yaml"
        def comp(list); (list || []).map{|s| Regexp.new(s)} rescue []; end

        @@WL_M ||= nil; @@WL ||= nil
        def wl_gambling()
          path = ENV["MINISOAR_WL_PATH"] || "/etc/logstash/minisoar-whitelist.yml"
          m = File.mtime(path) rescue nil
          if @@WL.nil? || (m && @@WL_M != m)
            @@WL = YAML.safe_load(File.read(path), permitted_classes: [], aliases: false) rescue {}
            @@WL_M = m
          end
          @@WL["gambling"] || {}
        end

        @rx_slot_kw = /
          \b(
            judi|casino|slot|gacor|maxwin|scatter|jackpot|shio|
            slot88|pgsoft|pragmatic|sugar[-_ ]?rush|sateslot|bet|togel|rtp|free\s*spin
          )\b
        /ix
        @rx_safe_static = /\.(?:pdf|png|jpe?g|gif|webp|svg|bmp|css|js|ico|woff2?)(?:\z|\?)/i
      '
      code => '
        begin
          g   = wl_gambling()
          hosts_publik = (g["hosts_publik"] || []).map{|x| x.to_s.downcase }
          news_section = comp(g["news_section"])
          anti_phrases = comp(g["anti_judi_phrases"])
          slot_non     = comp(g["slot_non_gambling"])
          host_path    = g["host_path_allow"] || {}

          url = event.get("url_original").to_s
          host = (event.get("server_name") || "").to_s.downcase
          tags = (event.get("tags") || [])

          # host+path allow spesifik
          if host_path[host].is_a?(Array)
            allow = host_path[host].any? { |pat| Regexp.new(pat) =~ url } rescue false
            if allow
              tags |= ["info_judi_mention"]
              event.set("tags", tags)
              return
            end
          end

          has_kw   = (url =~ @rx_slot_kw)
          safe_st  = (url =~ @rx_safe_static)
          news_ctx = news_section.any? { |rx| url =~ rx }
          anti_j   = anti_phrases.any? { |rx| url =~ rx }
          non_slot = slot_non.any? { |rx| url =~ rx }

          if has_kw
            if hosts_publik.include?(host) && (news_ctx || anti_j)
              tags |= ["info_judi_mention"]
            elsif non_slot
              # ignore
            elsif hosts_publik.include?(host) && safe_st
              # ignore
            else
              tags |= ["alert_gambling_slot","sig_gambling_slot"]
              event.set("[minisoar][severity]", "high")
            end
          end

          event.set("tags", tags) unless tags.empty?
        rescue
        end
      '
    }
  }

  # Burst khusus judi/slot (60s) — task_id unik, tidak bentrok
  if "sig_gambling_slot" in [tags] {
    aggregate {
      task_id => "gmb|%{src_ip}|%{server_name}"
      code => "
        map['count'] ||= 0
        map['count'] += 1
        map['src_ip'] ||= event.get('src_ip') || '(unknown)'
        map['server_name'] ||= event.get('server_name') || '(unknown)'
        u = event.get('url_original') || '-'
        map['sample_counts'] ||= {}
        map['sample_counts'][u] = (map['sample_counts'][u] || 0) + 1
        ts = event.get('@timestamp'); map['last_seen'] = ts if ts
      "
      timeout => 60
      push_map_as_event_on_timeout => true
      timeout_tags => ["_gmb_burst"]
    }
  }

  if "_gmb_burst" in [tags] and [count] {
    ruby {
      code => '
        thr = (ENV["GAMBLING_BURST_THRESHOLD"] || "50").to_i
        if event.get("count").to_i >= thr
          sc = event.get("sample_counts") || {}
          arr = sc.map{|u,c| {"url"=>u,"count"=>c}}.sort_by{|h| -h["count"].to_i}[0,5]
          event.set("top_urls", arr)
          event.tag("alert_url_minor")
          event.set("[minisoar][severity]", "medium") unless event.get("[minisoar][severity]")
        else
          event.cancel
        end
      '
    }
  }

  ########################################################################
  # [D] Burst akses per URL (dipertahankan dari config kamu)
  ########################################################################
  aggregate {
    task_id => "%{src_ip}_%{server_name}_%{url_original}_%{http_status}"
    code => "
      map['count'] ||= 0
      map['count'] += 1
      map['src_ip'] ||= event.get('src_ip')
      map['url_original'] ||= event.get('url_original')
      map['http_status'] ||= event.get('http_status')
      map['server_name'] ||= event.get('server_name')
      ts = event.get('@timestamp')
      if ts
        if map['last_seen'].nil? || ts > map['last_seen']
          map['last_seen'] = ts
        end
      end
    "
    timeout => 60
    push_map_as_event_on_timeout => true
    timeout_tags => ["_aggregated_url"]
  }
  if "_aggregated_url" in [tags] and [count] and [http_status] {
    ruby {
      code => '
        error_codes = ["400","401","403","404","500","502","503"]
        c = event.get("count").to_i
        st = event.get("http_status").to_s
        if c >= 1200 && error_codes.include?(st)
          event.tag("alert_url_major")
        elsif c >= 600
          event.tag("alert_url_minor")
        end
      '
    }
  }

  ########################################################################
  # [E] Distributed error (dipertahankan)
  ########################################################################
  aggregate {
    task_id => "%{server_name}_%{http_status}"
    code => "
      map['count'] ||= 0
      map['count'] += 1
      map['ip_list'] ||= []
      ip = event.get('src_ip'); map['ip_list'] << ip unless map['ip_list'].include?(ip)
      map['url_counts'] ||= {}
      u = event.get('url_original'); map['url_counts'][u] = (map['url_counts'][u] || 0) + 1 if u
      map['server_name'] ||= event.get('server_name')
      map['http_status'] ||= event.get('http_status')
      ts = event.get('@timestamp')
      if ts
        if map['last_seen'].nil? || ts > map['last_seen']
          map['last_seen'] = ts
        end
      end
    "
    timeout => 60
    push_map_as_event_on_timeout => true
    timeout_tags => ["_distributed_error"]
  }
  if "_distributed_error" in [tags] and [http_status] {
    ruby {
      code => '
        error_codes = ["400","401","403","404","500","502","503"]
        ip_count = (event.get("ip_list") || []).size
        if event.get("count").to_i >= 1000 && ip_count > 50 && error_codes.include?(event.get("http_status").to_s)
          event.tag("alert_distributed_error")
          h = event.get("url_counts") || {}
          tops = h.sort_by{|k,v| -v}[0,5].map{|k,v| {"url"=>k, "count"=>v}}
          event.set("top_urls", tops)
        else
          event.cancel
        end
      '
    }
  }

  ########################################################################
  # [F] Random URL (dipertahankan – whitelist YAML dsb.)
  ########################################################################
  aggregate {
    task_id => "%{src_ip}_%{server_name}_random"
    code => "
      map['url_list'] ||= []
      u = event.get('url_original')
      map['url_list'] << u unless map['url_list'].include?(u)
      map['ip'] ||= event.get('src_ip')
      map['server_name'] ||= event.get('server_name')
      st = (event.get('[http][response][status_code]') || event.get('http_status') || 0).to_i
      map['count'] = (map['count'] || 0) + 1
      if st >= 400 && st < 500
        map['error_count'] = (map['error_count'] || 0) + 1
      end
      ts = event.get('@timestamp')
      if ts
        if map['last_seen'].nil? || ts > map['last_seen']
          map['last_seen'] = ts
        end
      end
    "
    timeout => 60
    push_map_as_event_on_timeout => true
    timeout_tags => ["_random_url"]
  }
  if "_random_url" in [tags] {
    ruby {
      init => '
        require "yaml"
        def comp(list); (list || []).map{|s| Regexp.new(s)} rescue []; end
        @@WL ||= nil; @@WL_M ||= nil
        def wl()
          path = ENV["MINISOAR_WL_PATH"] || "/etc/logstash/minisoar-whitelist.yml"
          m = File.mtime(path) rescue nil
          if @@WL.nil? || (m && @@WL_M != m)
            @@WL = YAML.safe_load(File.read(path), permitted_classes: [], aliases: false) rescue {}
            @@WL_M = m
          end
          @@WL
        end
      '
      code => '
        cfg = wl()["random_url"] || {}
        host = (event.get("server_name") || "").to_s.downcase
        ph = (cfg["per_host"] || {})[host] || {}
        minU = (ph["min_unique"] || cfg["min_unique"] || 30).to_i
        minR = (ph["min_err_ratio"] || cfg["min_err_ratio"] || 0.6).to_f
        ua_allow   = comp(cfg["ua_allow"])
        path_allow = comp(cfg["path_allow"])
        url_list = event.get("url_list") || []
        st_total = (event.get("count") || 0).to_i
        err_total = (event.get("error_count") || 0).to_i
        ratio = (st_total > 0) ? (err_total.to_f / st_total) : 0.0
        ua = (event.get("[user_agent][original]") || event.get("user_agent") || "").to_s
        if ua_allow.any?{|rx| ua =~ rx}; event.cancel; return; end
        if url_list.any?{|u| path_allow.any?{|rx| u =~ rx}}; event.cancel; return; end
        if url_list.size >= minU && ratio >= minR
          event.tag("alert_random_url")
          event.set("url_count", url_list.size)
        else
          event.cancel
        end
      '
    }
  }
}

# === WebShell Immediate & Burst (ini satu-satunya aggregator webshell dg timeout) ===
filter {
  if ![http_status] and [http][response][status_code] {
    mutate { add_field => { "http_status" => "%{[http][response][status_code]}" } }
    mutate { convert => { "http_status" => "integer" } }
  }
  if ![method] and [http][request][method] {
    mutate { add_field => { "method" => "%{[http][request][method]}" } }
  }

  # Immediate vs Counted
  if "alert_webshell_name" in [tags] or "alert_webshell_heur" in [tags] {
    ruby {
      code => '
        m  = (event.get("method") || event.get("[http][request][method]") || "").to_s.upcase
        st = (event.get("http_status") || event.get("[http][response][status_code]") || 0).to_i
        if (st == 200) || (m == "POST")
          event.tag("alert_webshell_immediate")
          event.set("[minisoar][severity]", "high")
        else
          event.tag("webshell_for_burst")
          event.tag("silence_webshell_single")  # supaya tidak masuk alert-pipeline
        end
      '
    }
  }

  # AGGREGATE WebShell Burst — kumpulkan juga sample Top-5 (method;url;status)
  if "webshell_for_burst" in [tags] {
    aggregate {
      task_id => "wsb|%{src_ip}|%{server_name}"  # UNIK & satu-satunya yang pakai timeout
      code => '
        map["count"] ||= 0
        m  = (event.get("method") || event.get("[http][request][method]") || "").to_s.upcase
        st = (event.get("http_status") || event.get("[http][response][status_code]") || 0).to_i
        u  =  event.get("url_original") || event.get("url") || event.get("request") || event.get("path") || "-"
        if m == "GET" && st != 200
          map["count"] += 1
          map["src_ip"] ||= event.get("src_ip") || "(unknown)"
          map["server_name"] ||= event.get("server_name") || "(unknown)"
          map["@timestamp"] = event.get("@timestamp")

          # kumpulkan sample
          map["sample_counts"] ||= {}
          key = [m, st, u].join("|")
          map["sample_counts"][key] = (map["sample_counts"][key] || 0) + 1
        end
      '
      timeout => 60
      push_map_as_event_on_timeout => true
      timeout_tags => ["_webshell_burst_timeout"]
    }
  }

  if "_webshell_burst_timeout" in [tags] and [count] {
    ruby {
      code => '
        thr = (ENV["WEBSHELL_BURST_THRESHOLD"] || "30").to_i
        if event.get("count").to_i >= thr
          # build samples array Top-5
          sc = event.get("sample_counts") || {}
          arr = sc.map do |k,v|
            parts = k.split("|", 3)
            {"method"=>parts[0], "status"=>parts[1], "url"=>parts[2], "count"=>v}
          end
          arr.sort_by!{|h| -h["count"].to_i}
          event.set("samples", arr[0,5])

          event.tag("alert_url_minor")
          event.tag("webshell_burst")
          event.set("[minisoar][severity]", "medium") unless event.get("[minisoar][severity]")
        else
          event.cancel
        end
      '
    }
  }
}

output {
  # KIRIM ke alert-pipeline — tetapi JANGAN kirim yang ditandai silence_webshell_single
  if "silence_webshell_single" not in [tags] and (
      "alert_url_major" in [tags] or
      "alert_url_minor" in [tags] or
      "alert_distributed_error" in [tags] or
      "alert_random_url" in [tags] or
      "alert_gambling_slot" in [tags] or
      "alert_url_probe" in [tags] or
      "alert_webshell_name" in [tags] or
      "alert_webshell_heur" in [tags] or
      "alert_webshell_immediate" in [tags]
    ) {
    pipeline { send_to => "alert-pipeline" }
  }

  if "_missing_field" in [tags] {
    file { path => "/tmp/logstash_missing_fields.log" codec => json_lines }
  }
}
