stages:
  - security
  - lint
  - sonarqube
  - test

# ==================== STAGE: SECURITY ====================

gitleaks-scan:
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --verbose --source .
  rules:
    - when: manual

bandit-scan:
  stage: security
  image: python:3.10-slim
  script:
    - pip install bandit
    - bandit -r minisoar/
  rules:
    - when: manual

# ==================== STAGE: LINT ====================

ruff-check:
  stage: lint
  image: python:3.10-slim
  script:
    - pip install ruff
    - ruff check minisoar/
    - ruff format --check minisoar/
  rules:
    - when: manual

mypy-check:
  stage: lint
  image: python:3.10-slim
  script:
    - pip install -r requirements.txt
    - pip install mypy types-redis types-requests types-PyYAML
    - mypy minisoar/
  rules:
    - when: manual

# ==================== STAGE: SONARQUBE ====================

sonarqube-check:
  stage: sonarqube
  tags:
    - sonar-scanner
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "sonar-${CI_PROJECT_ID}"
    paths:
      - .sonar/cache
  script:
    - echo "SONAR_HOST_URL=${SONAR_HOST_URL}"
    - echo "SONAR_TOKEN_LENGTH=${#SONAR_TOKEN}"
    - |
      sonar-scanner \
        -Dsonar.host.url="${SONAR_HOST_URL}" \
        -Dsonar.token="${SONAR_TOKEN}" \
        -Dsonar.projectKey="${CI_PROJECT_PATH_SLUG}" \
        -Dsonar.projectName="${CI_PROJECT_PATH}" \
        -Dsonar.sources=. \
        -Dsonar.qualitygate.wait=true
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      when: manual

# ==================== STAGE: TEST (DRAFT) ====================

pytest-run:
  stage: test
  image: python:3.10-slim
  script:
    - pip install -r requirements.txt
    - pip install pytest
    - pytest
  rules:
    - when: manual
      allow_failure: true